<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>配送番号判別</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }
      .container {
        max-width: 600px;
        margin: auto;
      }
      input {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
        background: #007aff;
        color: white;
      }
      .result-box {
        margin-top: 20px;
        padding: 15px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        word-break: break-word;
      }
      .small {
        font-size: 14px;
        color: #666;
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>📦 配送番号判別</h2>

      <input type="text" id="tracking" placeholder="追跡番号を入力" />
      <button onclick="detect()">判別する</button>

      <div id="result"></div>
    </div>

    <script>
      // ===== URLからパラメータ取得 =====
      function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      // ===== URLを書き換え（リロードなし）=====
      function updateURL(number) {
        const newUrl =
          window.location.pathname + '?no=' + encodeURIComponent(number);
        window.history.replaceState(null, '', newUrl);
      }

      // ===== 判別処理 =====
      function detect(numberFromURL = null) {
        const input = document.getElementById('tracking');
        const num = numberFromURL || input.value.trim();
        if (!num) return;

        input.value = num;
        updateURL(num);

        let carriers = [];

        if (/^(DA|TBA|TBM|TBC)\d+/i.test(num)) {
          carriers.push({
            platform: 'Amazon',
            name: 'Amazon配送業者（内部）',
            note: 'Amazonサイト内でのみ追跡可能',
            url:
              'https://www.amazon.co.jp/gp/css/summary/edit.html?orderID=' +
              num.replace(/^\D+/, ''),
          });
        }
        if (/^[A-Z]{2}\d{9}CN$/i.test(num)) {
          carriers.push({
            platform: 'AliExpress / TEMU',
            name: '国際郵便 → 日本郵便',
            note: '',
            url:
              'https://trackings.post.japanpost.jp/services/srv/search/direct?reqCodeNo1=' +
              num,
          });
        }
        if (/^LP\d+CN$/i.test(num)) {
          carriers.push({
            platform: 'AliExpress',
            name: 'Cainiao',
            note: '',
            url: 'https://global.cainiao.com/detail.htm?mailNoList=' + num,
          });
        }
        if (/^\d{12}$/.test(num)) {
          carriers.push({
            platform: '佐川急便',
            name: '佐川急便',
            note: '',
            url:
              'https://k2k.sagawa-exp.co.jp/p/web/okurijosearch.do?okurijoNo=' +
              num,
          });
        }
        if (/^\d{11}$/.test(num)) {
          carriers.push({
            platform: 'ヤマト運輸',
            name: 'ヤマト運輸',
            note: '',
            url:
              'https://toi.kuronekoyamato.co.jp/cgi-bin/tneko?number00=' + num,
          });
        }
        if (/^\d{11,13}$/.test(num)) {
          carriers.push({
            platform: '日本郵便',
            name: '日本郵便',
            note: '',
            url:
              'https://trackings.post.japanpost.jp/services/srv/search/direct?reqCodeNo1=' +
              num,
          });
        }

        let html = `<div class="result-box">`;
        if (carriers.length === 0) {
          html += `<div>配送会社を特定できませんでした。</div>`;
        } else {
          carriers.forEach((carrier) => {
            html += `<div><b>プラットフォーム:</b> ${carrier.platform}</div>`;
            html += `<div><b>配送会社:</b> ${carrier.name}</div>`;
            if (carrier.note) {
              html += `<div class="small">${carrier.note}</div>`;
            }
            if (carrier.url) {
              html += `<div style="margin-top:15px;"><a href="${carrier.url}" target="_blank">追跡ページを開く</a></div>`;
            }
            html += `<hr style="margin:20px 0;">`;
          });
        }
        document.getElementById('result').innerHTML = html;
      }

      // ===== Enterキー対応 =====
      document
        .getElementById('tracking')
        .addEventListener('keypress', function (e) {
          if (e.key === 'Enter') detect();
        });

      // ===== ページ読み込み時にGET判定 =====
      window.onload = function () {
        const no = getQueryParam('no');
        if (no) detect(no);
      };
    </script>
  </body>
</html>
